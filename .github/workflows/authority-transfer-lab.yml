name: Disposable Claude authority-transfer lab

on:
  issue_comment:
    types: [created]

concurrency:
  group: authority-transfer-lab-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '@claude lab-authority-transfer' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      vars.LAB_ARMED == 'true' &&
      github.repository == vars.LAB_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo.full_name === context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Lab requires a genuine external-fork PR');
              return;
            }
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('author', pr.user.login);

      - name: Checkout untrusted PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Record preflight evidence
        env:
          EXPECTED_REPOSITORY: ${{ vars.LAB_REPOSITORY }}
          DESIGNATED_ISSUE: ${{ vars.LAB_ISSUE_NUMBER }}
          LAB_NONCE: ${{ vars.LAB_NONCE }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repo }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          TRIGGER_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${DESIGNATED_ISSUE}" -gt 0
          test -n "${LAB_NONCE}"
          test "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "pr_number=${{ github.event.issue.number }}" \
            "head_repository=${HEAD_REPOSITORY}" \
            "head_sha=${HEAD_SHA}" \
            "base_sha=${BASE_SHA}" \
            "pr_author=${PR_AUTHOR}" \
            "trigger_actor=${TRIGGER_ACTOR}" \
            "designated_issue=${DESIGNATED_ISSUE}" \
            "lab_nonce=${LAB_NONCE}" \
            "skills_link=$(readlink .claude/skills)" \
            "skills_resolved=$(python3 -c 'import pathlib; print(pathlib.Path(".claude/skills").resolve())')"
          test "$(readlink .claude/skills)" = "../.agents/skills"
          test -f .claude/skills/code-review/SKILL.md

      - name: Run Claude review
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855
        env:
          LAB_REPOSITORY: ${{ vars.LAB_REPOSITORY }}
          LAB_ISSUE_NUMBER: ${{ vars.LAB_ISSUE_NUMBER }}
          LAB_NONCE: ${{ vars.LAB_NONCE }}
        with:
          claude_code_oauth_token: ${{ secrets.LAB_CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Run /code-review on this pull request. Follow the repository's
            code-review skill. Do not perform operations other than those
            explicitly required by that skill.
          track_progress: true
          use_sticky_comment: false
          claude_args: >-
            --allowedTools "Bash(gh api:*)"

